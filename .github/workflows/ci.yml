name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast headless checks: all unit tests, lints, formatting.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries Tauri needs to compile
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Release script tests (version bump, changelog)
        run: node --test scripts/release-lib.test.mjs
      - run: npm run build # src-tauri needs ../dist to compile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Real builds on the two target OSes. Uploads unsigned test builds.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            artifact: glitch-windows
            path: target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app
            artifact: glitch-macos
            path: Glitch-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build # src-tauri needs ../dist to compile
      - name: Rust unit tests on this OS
        run: cargo test --workspace
      - name: Build the app
        run: npx tauri build ${{ matrix.args }}
      # Launches the built exe and drives it over WebView2's DevTools port:
      # first run, setup, bubble, mascot clicks, settings, quit, and checks
      # IPC never stalls (the old build deadlocked on window creation). No
      # Ollama on the runner, so chat must fail cleanly instead.
      # continue-on-error until it has proven stable on hosted runners.
      - name: Smoke test the built app (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        timeout-minutes: 5
        run: node dev/windows-smoke.mjs --exe target/release/glitch.exe
      - name: Zip the macOS app (artifact uploads drop the executable bit)
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --keepParent target/universal-apple-darwin/release/bundle/macos/Glitch.app Glitch-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
