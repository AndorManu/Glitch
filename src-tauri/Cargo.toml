[package]
name = "glitch"
description = "Glitch, a tiny desktop companion"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
glitch-core = { path = "../crates/glitch-core" }
# >= 2.12.1: transparent windows on macOS no longer need the `macos-private-api` flag.
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
