[package]
name = "glitch"
description = "Glitch, a tiny desktop companion"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
glitch-core = { path = "../crates/glitch-core" }
# >= 2.12.1: transparent windows on macOS no longer need the `macos-private-api` flag.
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "net"] }
# Twitch chat over TLS for the stream overlay (src/stream/sources.rs). Same
# OS TLS as reqwest below, already in the dependency tree.
tokio-native-tls = "0.3"
# Auto-update from GitHub Releases (src/autoupdate.rs), signature-checked.
# OS TLS like reqwest below (no rustls/ring build).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }

# Voice commands (src/voice/). Speech-to-text runs on this computer with
# whisper.cpp (built from source by whisper-rs-sys; needs cmake + a C++
# compiler, see .cargo/config.toml for the portable-CPU build flags).
whisper-rs = "0.16"
tauri-plugin-global-shortcut = "2.4"
# Speech-model download over HTTPS with the OS's own TLS (SChannel on
# Windows, Security.framework on macOS): no extra TLS stack in the binary.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha1_smol = "1"
# Only for the debug-build capture check (src/desktop.rs); already in the tree via glitch-core.
image = { version = "0.25", default-features = false, features = ["png"] }
# Clipboard text for the read_clipboard / write_clipboard tools.
arboard = { version = "3", default-features = false }
open = "5"

# Microphone capture (WASAPI / CoreAudio). Linux isn't a target and would
# need the ALSA dev headers, so voice is unavailable there.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.18"

# Reading other apps' window positions so Glitch can stand on them
# (src/world_native.rs). Both are already part of Tauri's dependency tree.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_System_DataExchange",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# UI Automation (COM) for password fields to cover in screenshots and for
# reading selected text (src/desktop.rs). Already in the tree via webview2-com.
# Also the system media session (src/context_native.rs: is music or a video
# playing, and the track title when the user asks).
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
# Reading speech WAVs in the live voice checks (src/voice/live_check.rs).
hound = "3"
