<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glitch animation gallery</title>
    <!-- Dev only: every mascot animation, live and as frame strips.
         Open http://localhost:1420/dev/gallery.html with the Vite dev server running.
         Query: ?bg=%23336655  ?left=1 (face left)  ?strip=walk,dangle (only those strips)  ?live=0 -->
    <style>
      body { margin: 0; padding: 16px; font: 13px/1.3 system-ui, sans-serif; color: #eee; background: #2e6b58; }
      h2 { margin: 18px 0 8px; font-size: 15px; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .card { background: rgba(0, 0, 0, 0.12); border-radius: 8px; padding: 6px; }
      .card b { display: block; margin-bottom: 4px; }
      canvas { display: block; image-rendering: pixelated; }
      .live canvas { width: 320px; height: 320px; }
      .strip { display: flex; gap: 2px; flex-wrap: wrap; }
      .strip canvas { width: 160px; height: 160px; outline: 1px dashed rgba(255, 255, 255, 0.15); }
      .strip small { display: block; text-align: center; opacity: 0.7; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
