<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glitch is driving</title>
    <link rel="icon" href="data:," />
    <style>
      /* 440x52 CSS px, always on top, never focused, click-through (src-tauri/src/hands.rs). */
      :root {
        --bg: #2a1840;
        --text: #fff8e8;
        --accent: #ff2bd6;
        --accent-2: #29f1ff;
      }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { user-select: none; -webkit-user-select: none; font: 600 14px/1.2 "Segoe UI", system-ui, sans-serif; }
      .bar {
        position: absolute; inset: 6px;
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px;
        background: var(--bg);
        color: var(--text);
        border-radius: 10px;
        box-shadow: 0 0 0 2px var(--accent), 4px 4px 0 2px rgba(41, 241, 255, 0.45);
      }
      .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
      .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      kbd { font: inherit; padding: 0 5px; border-radius: 4px; background: var(--text); color: var(--bg); }
      @media (prefers-reduced-motion: no-preference) {
        .dot { animation: blink 1s steps(2) infinite; }
        @keyframes blink { 50% { background: var(--accent-2); } }
      }
    </style>
  </head>
  <body>
    <div class="bar" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span class="text" id="text">Glitch is driving. Press <kbd>Esc</kbd> to stop.</span>
    </div>
    <script type="module" src="/src/banner/main.ts"></script>
  </body>
</html>
