<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>A note from Glitch</title>
    <link rel="icon" href="data:," />
    <style>
      /* 210x150 CSS px window (src-tauri/src/chaos.rs). Transparent around the note. */
      :root {
        --paper: #fff27a;
        --paper-dark: #e8d94f;
        --ink: #2a1840;
        --glitch: #ff2bd6;
        --glitch-2: #29f1ff;
      }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { user-select: none; -webkit-user-select: none; font-family: "Cascadia Mono", "Consolas", "Menlo", monospace; }
      .note {
        position: absolute; inset: 8px 8px 10px 6px;
        background: var(--paper);
        color: var(--ink);
        /* chunky pixel border + hard pixel shadow */
        box-shadow: 0 0 0 3px var(--ink), 5px 5px 0 3px rgba(42, 24, 64, 0.35);
        transform: rotate(-1.5deg);
        padding: 22px 14px 12px;
        box-sizing: border-box;
        image-rendering: pixelated;
      }
      .note::before {
        /* tape */
        content: ""; position: absolute; top: -9px; left: 50%; width: 54px; height: 16px; margin-left: -27px;
        background: repeating-linear-gradient(90deg, rgba(41, 241, 255, 0.7) 0 6px, rgba(255, 43, 214, 0.55) 6px 12px);
        box-shadow: 0 0 0 2px var(--ink);
      }
      .text { font-size: 15px; line-height: 1.25; font-weight: 700; letter-spacing: 0.2px; text-shadow: 1px 0 rgba(255, 43, 214, 0.45), -1px 0 rgba(41, 241, 255, 0.45); }
      .sig { position: absolute; right: 12px; bottom: 8px; font-size: 11px; opacity: 0.7; }
      button {
        position: absolute; top: 3px; right: 4px; width: 26px; height: 26px;
        border: 0; background: transparent; color: var(--ink); font: 700 18px/1 inherit; cursor: pointer;
      }
      button:hover { color: var(--glitch); }
      button:focus-visible { outline: 3px solid var(--glitch); outline-offset: -3px; }
      @media (prefers-reduced-motion: no-preference) {
        .note { animation: wobble 2.6s steps(2) infinite; }
        @keyframes wobble { 50% { transform: rotate(1deg); } }
      }
    </style>
  </head>
  <body>
    <div class="note" role="note">
      <button type="button" id="close" aria-label="Close the note">×</button>
      <div class="text" id="text"></div>
      <div class="sig">- glitch</div>
    </div>
    <script type="module" src="/src/chaos/note.ts"></script>
  </body>
</html>
