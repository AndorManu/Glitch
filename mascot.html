<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glitch</title>
    <style>
      /* Transparent page: only Glitch's pixels are visible on the desktop.
         The window is 160x160; Rust makes everything but his body click through. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { user-select: none; -webkit-user-select: none; }
      canvas { display: block; width: 160px; height: 160px; cursor: grab; touch-action: none; }
      canvas:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <canvas id="glitch" width="160" height="160" aria-label="Glitch. Click to chat, drag to carry him around."></canvas>
    <script type="module" src="/src/mascot/main.ts"></script>
  </body>
</html>
