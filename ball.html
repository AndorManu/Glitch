<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glitch's ball</title>
    <link rel="icon" href="data:," />
    <style>
      /* 44x44 CSS px window (src-tauri/src/play.rs): just the glowing ball. */

      body { user-select: none; -webkit-user-select: none; }
      canvas { display: block; width: 44px; height: 44px; cursor: grab; touch-action: none; }
      canvas:active { cursor: grabbing; }
    </style>

    <canvas id="ball" aria-label="Glitch's ball: drag and flick it to throw. Esc or right-click ends the game." role="img"></canvas>
