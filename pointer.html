<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glitch's pointer</title>
    <link rel="icon" href="data:," />
    <style>
      /* A transparent, click-through, never-focused window (src-tauri/src/hands_desktop/overlay.rs). */
      :root { --bg: #2a1840; --text: #fff8e8; --accent: #ff2bd6; --accent-2: #29f1ff; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { user-select: none; -webkit-user-select: none; font: 700 15px/1 "Segoe UI", system-ui, sans-serif; }
      #stage { position: absolute; inset: 0; opacity: 0; transition: opacity 0.18s ease-out; }
      #stage.on { opacity: 1; }
      svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #label {
        position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
        padding: 5px 10px; border-radius: 999px; white-space: nowrap;
        background: var(--bg); color: var(--text); box-shadow: 0 0 0 2px var(--accent);
      }
      .ring-outer { transform-origin: 120px 120px; }
      @media (prefers-reduced-motion: no-preference) {
        #stage.on .ring-outer { animation: spin 3.2s linear infinite, breathe 0.9s ease-in-out infinite alternate; }
        #stage.on .ring-inner { transform-origin: 120px 120px; animation: breathe 0.9s ease-in-out infinite alternate-reverse; }
        #stage.on .paw { animation: tap 0.9s ease-in-out infinite; transform-origin: 70px 70px; }
        #stage.pop .ring-burst { animation: burst 0.36s ease-out forwards; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes breathe { from { scale: 0.94; } to { scale: 1.04; } }
        @keyframes tap { 50% { transform: translate(5px, 5px); } }
        @keyframes burst { from { opacity: 0.9; r: 34px; } to { opacity: 0; r: 100px; } }
      }
      .ring-burst { opacity: 0; fill: none; stroke: var(--accent-2); stroke-width: 6; }
      #stage.pop .ring-burst { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true">
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring-outer" cx="120" cy="120" r="86" fill="none" stroke="#ff2bd6" stroke-width="6" stroke-dasharray="22 14" stroke-linecap="round" />
        <circle class="ring-inner" cx="120" cy="120" r="34" fill="rgba(41,241,255,0.14)" stroke="#29f1ff" stroke-width="4" />
        <circle class="ring-burst" cx="120" cy="120" r="34" />
        <!-- the ghost of the pointer, where it is about to land -->
        <path d="M120 120 L120 154 L129 146 L135 160 L143 157 L137 143 L149 143 Z" fill="rgba(255,248,232,0.72)" stroke="#2a1840" stroke-width="3" stroke-linejoin="round" />
        <!-- a little paw, pointing at it -->
        <g class="paw" transform="translate(30 30)">
          <ellipse cx="38" cy="46" rx="17" ry="14" fill="#2a1840" stroke="#fff8e8" stroke-width="3" />
          <circle cx="18" cy="26" r="7" fill="#2a1840" stroke="#fff8e8" stroke-width="3" />
          <circle cx="32" cy="16" r="7" fill="#2a1840" stroke="#fff8e8" stroke-width="3" />
          <circle cx="48" cy="16" r="7" fill="#2a1840" stroke="#fff8e8" stroke-width="3" />
          <circle cx="60" cy="27" r="7" fill="#2a1840" stroke="#fff8e8" stroke-width="3" />
        </g>
      </svg>
      <div id="label"></div>
    </div>
    <script type="module" src="/src/pointer/main.ts"></script>
  </body>
</html>
