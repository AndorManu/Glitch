[package]
name = "glitch-core"
description = "Glitch's brain: AI provider, tools, safety rules. No UI/Tauri dependency so it can be tested headlessly."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
# Screenshots go to the vision model as base64 (Ollama's `images` field).
base64 = "0.22"
# Local dates for the memory journal (already in Tauri's dependency tree).
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
# The local event endpoint's per-install token (OS random source; already in the tree).
getrandom = "0.3"
# canonicalize without Windows `\\?\` verbatim prefixes (paths stay openable).
dunce = "1"
# Scaling screenshots down and encoding them as JPEG for the vision model
# (src/vision.rs). PNG only to decode the eval's test screenshots.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# ShellExecuteW on Windows instead of spawning a hidden PowerShell per open.
open = { version = "5", features = ["shellexecute-on-windows"] }
# Ollama runs on localhost over plain HTTP, so no TLS stack is needed.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Glitch's belly: checks a file is still the one he ate before restoring it.
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
# spawn_blocking (file search must not stall the async runtime), and the
# local event endpoint's 127.0.0.1 listener (net, io-util).
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
url = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
